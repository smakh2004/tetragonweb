<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetragon</title>

  <!-- Favicon (your logo) -->
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css?v=31" />
</head>
<body>
  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <img class="logo" src="assets/tetragon.png" alt="Tetragon" />
  </header>

  <!-- ===== Landing (placeholder for the new main page) ===== -->
  <main class="landing" id="landing">
    <a class="register-btn" href="signup.html" data-i18n="register">Register</a>
  </main>

  <!-- ===== Language selector (collapsed by default) ===== -->
  <footer class="langbar">
    <div class="lang-switch" id="langSwitch">
      <span class="bar">|</span>
      <button class="lang-current" id="langCurrent" type="button">EN</button>
      <div class="lang-options" id="langOptions"></div>
    </div>
  </footer>

  <!-- shared language system -->
  <script src="js/i18n.js"></script>
  <!-- signed-in users go straight to their role's home page -->
  <script type="module" src="js/landing.js"></script>
</body>
</html>
