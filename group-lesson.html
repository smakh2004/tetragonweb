<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetragon — Group lesson</title>

  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css?v=32" />
  <link rel="stylesheet" href="css/groups.css?v=2" />
</head>
<body data-role="teacher">
  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <a href="index.html" class="logo-home">
      <img class="logo" src="assets/tetragon.png" alt="Tetragon" />
    </a>
    <a class="download-app download-app--pink login-link" href="login.html" aria-label="Log in">
      <img class="login-ico" src="assets/icons/login.png" alt="" />
      <span data-i18n="login">Log In</span>
    </a>
  </header>

  <p class="gp-loading" id="loading" data-i18n="loadingWord">Loading…</p>

  <main class="gp-main" id="notFound" hidden>
    <a class="gp-back" href="groups.html" data-i18n="backGroups">← My Groups</a>
    <p class="gp-empty" data-i18n="groupNotFound">Group not found.</p>
  </main>

  <!-- ===== Editor (same look as the lesson editor) ===== -->
  <main class="edit-main" id="page" hidden>
    <div class="edit-card-wrap">
      <a class="gp-back" id="backLink" href="#" style="align-self:flex-start">← <span id="backName"></span></a>

      <div class="edit-card">
        <div class="edit-scroll" id="editScroll">
          <label class="edit-name-label" for="lessonName" data-i18n="lessonNameLabel">Lesson name</label>
          <input class="edit-name-input" id="lessonName" type="text" maxlength="80"
                 data-i18n-placeholder="phGameName" placeholder="" />

          <!-- questions get inserted here -->
          <div id="questionsList"></div>

          <button class="edit-addq-btn" id="addQBtn" type="button" data-i18n="addQuestion">Add question</button>
        </div>

        <p class="edit-total" id="total"></p>
        <p class="edit-msg" id="msg" hidden></p>
      </div>

      <button class="edit-create-btn" id="saveBtn" type="button" data-i18n="createLesson">Create lesson</button>
    </div>
  </main>

  <!-- ===== Language selector (bottom-left) ===== -->
  <footer class="langbar">
    <div class="lang-switch" id="langSwitch">
      <span class="bar">|</span>
      <button class="lang-current" id="langCurrent" type="button">EN</button>
      <div class="lang-options" id="langOptions"></div>
    </div>
  </footer>

  <script src="js/i18n.js?v=7"></script>
  <script type="module" src="js/role-guard.js"></script>
  <script type="module" src="js/group-lesson.js"></script>
  <script type="module" src="js/user-menu.js"></script>
</body>
</html>
