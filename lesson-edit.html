<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetragon — Create Lesson</title>

  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css?v=27" />
</head>
<body class="mini-page lesson-edit-page">
  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <a href="index.html" class="logo-home">
      <img class="logo" src="assets/tetragon.png" alt="Tetragon" />
    </a>
    <span class="mini-title" data-i18n="createLessons">Create lessons</span>
    <a class="download-app download-app--pink login-link" href="login.html" aria-label="Log in">
      <img class="login-ico" src="assets/icons/login.png" alt="" />
      <span data-i18n="login">Log In</span>
    </a>
  </header>

  <!-- ===== Content ===== -->
  <main class="edit-main">
    <div class="lessons-state edit-state" id="loading" data-i18n="loadingWord">Loading…</div>

    <div class="lessons-state edit-state" id="signedOut" hidden>
      <p data-i18n="mustSignIn">Please log in to create lesson games.</p>
      <a class="lesson-signin-btn" href="login.html" data-i18n="login">Log In</a>
    </div>

    <!-- the editor card (matches image 3) -->
    <div class="edit-card-wrap" id="editWrap" hidden>
      <div class="edit-card">

        <!-- scrollable area: name + questions -->
        <div class="edit-scroll" id="editScroll">
          <label class="edit-name-label" for="lessonName" data-i18n="lessonNameLabel">Lesson name</label>
          <input class="edit-name-input" id="lessonName" type="text"
                 data-i18n-placeholder="phGameName" placeholder="" />

          <!-- questions get inserted here -->
          <div id="questionsList"></div>

          <!-- Add question (outline pill) -->
          <button class="edit-addq-btn" id="addQBtn" type="button" data-i18n="addQuestion">Add question</button>
        </div>

        <p class="edit-msg" id="msg" hidden></p>
      </div>

      <!-- Create lesson / Save (cyan pill, below the card) -->
      <button class="edit-create-btn" id="createBtn" type="button" data-i18n="createLesson">Create lesson</button>
    </div>
  </main>

  <!-- ===== Language selector (bottom-left) ===== -->
  <footer class="langbar">
    <div class="lang-switch" id="langSwitch">
      <span class="bar">|</span>
      <button class="lang-current" id="langCurrent" type="button">EN</button>
      <div class="lang-options" id="langOptions"></div>
    </div>
  </footer>

  <script src="js/i18n.js?v=4"></script>
  <script type="module" src="js/lessonedit2.js"></script>
  <script type="module" src="js/user-menu.js"></script>
</body>
</html>
