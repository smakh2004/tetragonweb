<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetragon — Create account</title>

  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/auth.css?v=2" />
</head>
<body class="auth-page" data-auth="signup">
  <main class="auth-split">

    <!-- LEFT: space for a Rive animation (solid #11c7ff for now) -->
    <aside class="auth-visual">
      <canvas id="authRive" class="auth-rive"></canvas>
    </aside>

    <!-- RIGHT: the form -->
    <section class="auth-form-side">
      <div class="auth-card">
        <a href="index.html" class="auth-logo"><img src="assets/tetragon.png" alt="Tetragon" /></a>

        <h1 class="auth-title" data-i18n="authSignup">Create account</h1>

        <button class="g-btn" id="googleBtn" type="button">
          <span data-i18n="continueGoogle">Continue with Google</span>
          <svg class="g-icon" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.9 2.4 30.4 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.9 6.1C12.3 13.2 17.7 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.5 3-2.2 5.5-4.7 7.2l7.3 5.7c4.3-4 6.2-9.9 6.2-17.4z"/>
            <path fill="#FBBC05" d="M10.4 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.9-6.1C.9 16.3 0 20 0 24s.9 7.7 2.5 10.7l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.6 2.3-6.3 0-11.7-3.7-13.6-9.9l-7.9 6.1C6.4 42.6 14.6 48 24 48z"/>
          </svg>
        </button>

        <div class="auth-or"><span data-i18n="orWord">or</span></div>

        <form class="auth-fields" id="authForm">
          <input class="auth-input" id="email" type="email" placeholder="email"
                 data-i18n-placeholder="phEmail"
                 autocomplete="email" autocapitalize="none" spellcheck="false" />
          <div class="auth-pass">
            <input class="auth-input" id="password" type="password" placeholder="password"
                   data-i18n-placeholder="phPassword"
                   autocomplete="new-password" />
            <button class="show-btn" id="showBtn" type="button" data-i18n="showWord">Show</button>
          </div>
          <button class="submit-btn" id="submitBtn" type="submit" data-i18n="signUp">Sign up</button>
        </form>

        <div class="auth-error" id="authError" hidden></div>

        <p class="auth-terms">
          <span data-i18n="termsBefore">By creating an account you agree to our</span>
          <a href="https://sites.google.com/view/tetragon-privacy-policy/home"
             target="_blank" rel="noopener noreferrer" data-i18n="privacyPolicy">Privacy Policy</a>.
        </p>

        <p class="auth-switch"><span data-i18n="haveAccount">Already have an account?</span> <a href="login.html" data-i18n="authLogin">Log in</a></p>
      </div>
    </section>
  </main>

  <!-- ===== Language selector (bottom-left) ===== -->
  <footer class="langbar">
    <div class="lang-switch" id="langSwitch">
      <span class="bar">|</span>
      <button class="lang-current" id="langCurrent" type="button">EN</button>
      <div class="lang-options" id="langOptions"></div>
    </div>
  </footer>

  <!-- Rive runtime (for the left-panel animation) -->
  <script src="https://unpkg.com/@rive-app/canvas@2"></script>
  <!-- shared language system -->
  <script src="js/i18n.js"></script>
  <!-- Auth logic (Firebase, module) -->
  <script type="module" src="js/auth.js?v=2"></script>
</body>
</html>
