<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetragon — My Groups</title>

  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css?v=32" />
  <link rel="stylesheet" href="css/groups.css?v=2" />
</head>
<body data-role="teacher">
  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <a href="index.html" class="logo-home">
      <img class="logo" src="assets/tetragon.png" alt="Tetragon" />
    </a>
    <a class="download-app download-app--pink login-link" href="login.html" aria-label="Log in">
      <img class="login-ico" src="assets/icons/login.png" alt="" />
      <span data-i18n="login">Log In</span>
    </a>
  </header>

  <main class="gp-main">
    <a class="gp-back" href="teacher.html" data-i18n="backHome">← Home</a>
    <h1 class="gp-h1" data-i18n="myGroups">My Groups</h1>
    <p class="gp-sub" data-i18n="groupsIntro">Create a group and share its ID with your students so they can join.</p>

    <section class="gp-card" style="margin-top:18px">
      <h2 class="gp-h2" data-i18n="newGroup">New group</h2>
      <form class="gp-form" id="createForm">
        <input class="gp-input" id="groupName" type="text" maxlength="60"
               placeholder="e.g. 7-A Math" data-i18n-placeholder="phGroupName" />
        <button class="gp-btn" id="createBtn" type="submit" data-i18n="createGroup">Create group</button>
      </form>
      <p class="gp-msg" id="msg" hidden></p>
    </section>

    <div class="gp-list" id="groupList">
      <p class="gp-loading" data-i18n="loadingWord">Loading…</p>
    </div>
  </main>

  <!-- ===== Language selector (bottom-left) ===== -->
  <footer class="langbar">
    <div class="lang-switch" id="langSwitch">
      <span class="bar">|</span>
      <button class="lang-current" id="langCurrent" type="button">EN</button>
      <div class="lang-options" id="langOptions"></div>
    </div>
  </footer>

  <script src="js/i18n.js?v=8"></script>
  <script type="module" src="js/role-guard.js"></script>
  <script type="module" src="js/groups.js"></script>
  <script type="module" src="js/user-menu.js"></script>
</body>
</html>
