<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetragon — Create Lessons</title>

  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css?v=27" />
</head>
<body class="mini-page lessons-page">
  <!-- ===== Top bar: logo (home) | title | Log In / user ===== -->
  <header class="topbar">
    <a href="index.html" class="logo-home">
      <img class="logo" src="assets/tetragon.png" alt="Tetragon" />
    </a>

    <span class="mini-title" data-i18n="createLessons">Create lessons</span>

    <a class="download-app download-app--pink login-link" href="login.html" aria-label="Log in">
      <img class="login-ico" src="assets/icons/login.png" alt="" />
      <span data-i18n="login">Log In</span>
    </a>
  </header>

  <!-- ===== Center: LEFT (avatar + PLAY) | RIGHT (lessons panel) ===== -->
  <main class="mini-main">

    <!-- ===== LEFT column ===== -->
    <div class="mini-left">
      <div class="game-box">
        <canvas id="avatar" class="avatar"></canvas>
      </div>

      <!-- PLAY is disabled until a lesson is chosen -->
      <button id="playBtn" class="play-btn is-disabled" type="button" data-i18n="play">PLAY</button>
    </div>

    <!-- ===== RIGHT column: lessons panel ===== -->
    <div class="mini-right">
      <div class="type-wrap">

        <!-- panel holds the lesson tiles + the Add-lesson tile + (while dragging) the bin -->
        <div class="type-panel lessons-panel" id="lessonsPanel">

          <!-- the grid of lesson tiles (built by JS) + Add-lesson tile -->
          <div class="lessons-grid" id="lessonsGrid" hidden></div>

          <!-- DELETE bin — only visible while dragging a lesson -->
          <div class="lesson-bin" id="lessonBin" hidden aria-hidden="true">
            <svg class="lesson-bin-ico" viewBox="0 0 24 24" width="34" height="34" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
              <path d="M10 11v6M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/>
            </svg>
            <span class="lesson-bin-text" data-i18n="deleteGame">Delete</span>
          </div>

        </div><!-- /lessons-panel -->

        <!-- custom scrollbar (same as mini-games) -->
        <div class="type-scroll" id="typeScroll">
          <button class="type-knob" id="typeKnob" type="button" aria-label="Scroll lessons">
            <img src="assets/icons/scroll_knob.png" alt="" />
          </button>
        </div>

      </div><!-- /type-wrap -->
    </div>

  </main>

  <!-- ===== Language selector (bottom-left) ===== -->
  <footer class="langbar">
    <div class="lang-switch" id="langSwitch">
      <span class="bar">|</span>
      <button class="lang-current" id="langCurrent" type="button">EN</button>
      <div class="lang-options" id="langOptions"></div>
    </div>
  </footer>

  <!-- 1) Rive runtime (avatar) -->
  <script src="https://unpkg.com/@rive-app/canvas@2"></script>
  <!-- 2) shared language system -->
  <script src="js/i18n.js?v=4"></script>
  <!-- 3) this page's logic -->
  <script type="module" src="js/lessonspage.js"></script>
  <!-- user menu (shows avatar + name when signed in) -->
  <script type="module" src="js/user-menu.js"></script>
</body>
</html>
