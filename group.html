<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetragon — Group</title>

  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css?v=32" />
  <link rel="stylesheet" href="css/groups.css?v=2" />
</head>
<body data-role="teacher">
  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <a href="index.html" class="logo-home">
      <img class="logo" src="assets/tetragon.png" alt="Tetragon" />
    </a>
    <a class="download-app download-app--pink login-link" href="login.html" aria-label="Log in">
      <img class="login-ico" src="assets/icons/login.png" alt="" />
      <span data-i18n="login">Log In</span>
    </a>
  </header>

  <p class="gp-loading" id="loading" data-i18n="loadingWord">Loading…</p>

  <main class="gp-main" id="notFound" hidden>
    <a class="gp-back" href="groups.html" data-i18n="backGroups">← My Groups</a>
    <p class="gp-empty" data-i18n="groupNotFound">Group not found.</p>
  </main>

  <main class="gp-main" id="page" hidden>
    <a class="gp-back" href="groups.html" data-i18n="backGroups">← My Groups</a>

    <section class="gp-card">
      <h1 class="gp-h1" id="groupName"></h1>
      <div class="gp-idrow">
        <span class="gp-sub" data-i18n="groupIdLabel">Group ID</span>
        <span class="gp-code gp-code--big" id="groupId"></span>
        <button class="gp-btn gp-btn--ghost gp-btn--sm" id="copyBtn" type="button" data-i18n="copyWord">Copy</button>
        <button class="gp-btn gp-btn--danger gp-btn--sm" id="deleteGroupBtn" type="button" data-i18n="deleteGroup">Delete group</button>
      </div>
      <p class="gp-sub" style="margin-top:10px" data-i18n="shareIdHint">Students join this group by entering the ID on their home page.</p>
    </section>

    <nav class="gp-tabs">
      <button class="gp-tab" type="button" data-tab="lessons" data-i18n="lessonsTab">Lessons</button>
      <button class="gp-tab" type="button" data-tab="board" data-i18n="leaderboard">Leaderboard</button>
      <button class="gp-tab" type="button" data-tab="students" data-i18n="studentsTab">Students</button>
    </nav>

    <section data-panel="lessons">
      <a class="gp-btn" id="newLessonBtn" href="#" data-i18n="createLesson" style="margin-bottom:14px">Create lesson</a>
      <p class="gp-msg" id="lessonMsg" hidden style="margin:-4px 0 14px"></p>
      <div class="gp-list" id="lessonList"></div>
    </section>

    <section data-panel="board">
      <div id="board"></div>
    </section>

    <section data-panel="students">
      <div class="gp-list" id="studentList"></div>
    </section>
  </main>

  <!-- ===== Language selector (bottom-left) ===== -->
  <footer class="langbar">
    <div class="lang-switch" id="langSwitch">
      <span class="bar">|</span>
      <button class="lang-current" id="langCurrent" type="button">EN</button>
      <div class="lang-options" id="langOptions"></div>
    </div>
  </footer>

  <script src="js/i18n.js?v=7"></script>
  <script type="module" src="js/role-guard.js"></script>
  <script type="module" src="js/group.js"></script>
  <script type="module" src="js/user-menu.js"></script>
</body>
</html>
