<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetragon</title>

  <!-- Favicon (your logo) -->
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />

  <!-- Inter font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/style.css?v=32" />
  <link rel="stylesheet" href="css/groups.css?v=2" />
</head>
<body data-role="student">
  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <img class="logo" src="assets/tetragon.png" alt="Tetragon" />

    <!-- replaced by the user menu (avatar + name) once signed in -->
    <a class="download-app login-link" href="login.html" aria-label="Log in">
      <img class="login-ico" src="assets/icons/login.png" alt="" />
      <span data-i18n="login">Log In</span>
    </a>
  </header>

  <!-- ===== Student home: join a group + my groups ===== -->
  <main class="gp-main">
    <h1 class="gp-h1" data-i18n="myGroups">My Groups</h1>

    <section class="gp-card" style="margin-top:14px">
      <h2 class="gp-h2" data-i18n="joinGroup">Join a group</h2>
      <form class="gp-form" id="joinForm">
        <input class="gp-input gp-input--code" id="joinCode" type="text" maxlength="12"
               autocomplete="off" autocapitalize="characters" spellcheck="false"
               placeholder="Group ID" data-i18n-placeholder="phGroupId" />
        <button class="gp-btn" id="joinBtn" type="submit" data-i18n="joinWord">Join</button>
      </form>
      <p class="gp-msg" id="msg" hidden></p>
    </section>

    <div class="gp-list" id="groupList">
      <p class="gp-loading" data-i18n="loadingWord">Loading…</p>
    </div>
  </main>

  <!-- ===== Language selector (collapsed by default) ===== -->
  <footer class="langbar">
    <div class="lang-switch" id="langSwitch">
      <span class="bar">|</span>
      <button class="lang-current" id="langCurrent" type="button">EN</button>
      <div class="lang-options" id="langOptions"></div>
    </div>
  </footer>

  <!-- shared language system -->
  <script src="js/i18n.js?v=7"></script>
  <!-- only students stay on this page -->
  <script type="module" src="js/role-guard.js"></script>
  <script type="module" src="js/student.js"></script>
  <!-- user menu (shows avatar + name when signed in) -->
  <script type="module" src="js/user-menu.js"></script>
</body>
</html>
